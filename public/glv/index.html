<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ giấy làm việc VACPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Bố cục: cột chỉ mục bên trái như mục lục hồ sơ kiểm toán; bên phải là "nhận từ → giấy đang chọn → đẩy sang" rồi tới phần giải thích. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#16233b; --mute:#5d6880; --line:#d9dde6;
  --navy:#14284b; --gold:#b8861f; --gold-soft:#fbf3df;
  --pA:#2f6fb2; --pC:#1f8a7a; --pS:#5a4fb0; --pH:#6b7280; --pB:#b8861f;
  --warn:#b4472e; --warn-soft:#fbebe6;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1624; --panel:#182235; --ink:#e7ebf3; --mute:#9aa6bd; --line:#2c3a54;
    --navy:#0b1324; --gold:#e0b04a; --gold-soft:#2c2614;
    --pA:#6aa6e6; --pC:#4fc0ae; --pS:#9d93ec; --pH:#a3acbb; --pB:#e0b04a;
    --warn:#ef8a6f; --warn-soft:#33201b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1624; --panel:#182235; --ink:#e7ebf3; --mute:#9aa6bd; --line:#2c3a54;
  --navy:#0b1324; --gold:#e0b04a; --gold-soft:#2c2614;
  --pA:#6aa6e6; --pC:#4fc0ae; --pS:#9d93ec; --pH:#a3acbb; --pB:#e0b04a;
  --warn:#ef8a6f; --warn-soft:#33201b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header.top{background:var(--navy);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em}
header.top h1 span{color:#e0b04a}
header.top .sub{font-size:12px;color:#b9c3d8}
.search{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search input,.search select{font:inherit;font-size:13.5px;padding:7px 10px;border-radius:6px;border:1px solid #3a4c70;background:#1d3156;color:#fff;min-width:0}
.search input{width:220px}
.search input::placeholder{color:#9fb0cf}
.body{display:grid;grid-template-columns:310px 1fr;min-height:0}
nav.idx{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px 0 30px}
main{overflow:auto;padding:20px 24px 60px}
.grp>button.gh{width:100%;text-align:left;background:none;border:0;padding:9px 14px 5px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;align-items:center}
.grp>button.gh i{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--c)}
.sec{border-top:1px solid var(--line)}
.sec>button{width:100%;text-align:left;background:none;border:0;padding:7px 14px;display:flex;gap:8px;align-items:baseline;font-weight:600}
.sec>button:hover,.row:hover{background:var(--bg)}
.row{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:4px 14px 4px 24px;display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.code{font-family:var(--f-code);font-size:12.5px;font-weight:600;color:var(--c,var(--ink));white-space:nowrap;min-width:54px}
.row .nm{color:var(--ink)}
.row.x .nm::after{content:" ·bổ sung";color:var(--mute);font-size:11px}
.on{background:var(--gold-soft)!important;border-left-color:var(--gold)!important}
.sec>button.on{box-shadow:inset 3px 0 0 var(--gold)}
.hasnote::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:auto;flex:none;align-self:center}
h2{font-size:22px;margin:0 0 4px;font-weight:700;text-wrap:balance}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:700}
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px}
.head .big{font-family:var(--f-code);font-size:22px;font-weight:600;color:var(--c);background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--c);padding:2px 12px;border-radius:6px}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mute);white-space:nowrap}
.pill.v{border-color:var(--pC);color:var(--pC)}
.pill.x{border-color:var(--gold);color:var(--gold)}
.lede{color:var(--mute);max-width:75ch;margin:0 0 18px}
.flow{display:grid;grid-template-columns:1fr 28px minmax(170px,.7fr) 28px 1fr;gap:0;align-items:stretch;margin-bottom:22px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.col.me{border:2px solid var(--c);display:flex;flex-direction:column;justify-content:center;text-align:center;gap:4px}
.col.me .code{font-size:20px;min-width:0}
.arr{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:20px}
.eg{margin-bottom:11px}
.eg:last-child{margin-bottom:0}
.eg p{margin:0 0 5px;font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:12.5px;display:inline-flex;gap:6px;align-items:baseline;text-align:left;max-width:100%}
.chip:hover{border-color:var(--c,var(--gold))}
.chip .code{min-width:0}
.chip small{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.empty{color:var(--mute);font-size:13px;font-style:italic}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card.wide{grid-column:1/-1}
.card ul{margin:0;padding-left:18px}
.card li{margin:3px 0}
.card p{margin:0 0 6px}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:0 0 8px}
.note.th{border-left-color:var(--pS);background:var(--bg)}
.note b{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:2px}
.note.th b{color:var(--pS)}
.note .at{margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.tw{overflow-x:auto}
.as{font-family:var(--f-code);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:3px;white-space:nowrap}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.path .st{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.path .st>span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.path>i{color:var(--mute);font-style:normal}
textarea{width:100%;min-height:76px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;font-size:13px}
.btn:hover{border-color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.legend em{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--warn)}
@media (max-width:860px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .body{display:block}
  nav.idx{max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:16px}
  .flow{grid-template-columns:1fr}
  .arr{transform:rotate(90deg);padding:2px}
  .search{margin-left:0;width:100%}
  .search input{flex:1}
}
@media (prefers-reduced-motion:no-preference){.row,.chip,.btn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div>
    <h1>Bản đồ <span>giấy làm việc</span> VACPA</h1>
    <div class="sub"><a href="/" style="color:#e0b04a">← Audit Learning Hub</a> · Chương trình kiểm toán mẫu BCTC · chọn một giấy để xem nó nhận gì, đẩy sang đâu</div>
  </div>
  <div class="search">
    <label class="sub" for="acc">Khoản mục</label>
    <select id="acc"></select>
    <input id="q" type="search" placeholder="Tìm mã hoặc tên giấy (vd D133, khấu hao)" aria-label="Tìm giấy làm việc">
  </div>
</header>
<div class="body">
  <nav class="idx" id="idx" aria-label="Chỉ mục giấy làm việc"></nav>
  <main id="main"></main>
</div>
</div>
<script>
"use strict";
/* ---------- 1. DỮ LIỆU ---------- */
const PH={A:{n:"A · Lập kế hoạch",c:"--pA"},C:{n:"C · KSNB và thủ tục chung",c:"--pC"},D:{n:"D · Tài sản",c:"--pS"},E:{n:"E · Nợ phải trả",c:"--pS"},F:{n:"F · Vốn chủ sở hữu",c:"--pS"},G:{n:"G · Kết quả kinh doanh",c:"--pS"},H:{n:"H · Nội dung khác",c:"--pH"},B:{n:"B · Tổng hợp và báo cáo",c:"--pB"}};
const ORDER=["A","C","D","E","F","G","H","B"];
const AS={E:"Hiện hữu",C:"Đầy đủ",A:"Chính xác",V:"Đánh giá",RO:"Quyền và nghĩa vụ",CO:"Đúng kỳ",CL:"Phân loại",PD:"Trình bày và thuyết minh",O:"Phát sinh"};
const P={},E=[],N=[];
// src: V = có mẫu trong CTKTM VACPA, I = có trong danh mục VACPA, X = bổ sung từ bài thực hành (vùng x50–x99)
function p(id,n,kind,src,o){P[id]=Object.assign({id,n,kind,src:src||"V",g:id[0],sec:null},o||{});}
function e(f,t,w){[].concat(f).forEach(a=>[].concat(t).forEach(b=>E.push({f:a,t:b,w})));}

/* A — kế hoạch */
p("A110","Chấp nhận khách hàng mới và đánh giá rủi ro hợp đồng","plan","V",{d:"Quyết định có nhận hợp đồng không và mức rủi ro hợp đồng.",need:["Thông tin pháp lý, chủ sở hữu, BGĐ","BCTC các năm trước","Trao đổi với KTV tiền nhiệm (A111)"]});
p("A120","Chấp nhận, duy trì khách hàng cũ","plan","V",{d:"Đánh giá lại rủi ro hợp đồng với khách hàng cũ.",need:["Hồ sơ kiểm toán năm trước","Thay đổi về chủ sở hữu, BGĐ, hoạt động"]});
p("A210","Hợp đồng kiểm toán","plan","V",{d:"Xác lập phạm vi, trách nhiệm, phí, thời hạn.",need:["Kết quả A110 hoặc A120"]});
p("A212","Thư hẹn kiểm toán","plan","V",{d:"Thay hợp đồng trong trường hợp dùng thư hẹn.",need:["Kết quả A110 hoặc A120"]});
p("A220","Chiến lược kiểm toán tổng thể","plan","V",{d:"Phạm vi, lịch trình, định hướng và nguồn lực của cuộc kiểm toán.",need:["Hợp đồng","Hiểu biết sơ bộ về khách hàng","Yêu cầu báo cáo, hạn phát hành"]});
p("A230","Thư gửi khách hàng về kế hoạch kiểm toán","plan","V",{d:"Thông báo lịch, nhóm kiểm toán, yêu cầu phối hợp.",need:["A220","A250"]});
p("A240","Danh mục tài liệu cần khách hàng cung cấp","plan","V",{d:"Danh sách sổ sách, chứng từ khách hàng phải chuẩn bị cho từng phần hành.",need:["Phạm vi từng phần hành","Chương trình kiểm toán dự kiến"]});
p("A250","Phân công nhân sự và nhiệm vụ nhóm kiểm toán","plan","V",{d:"A250.1 kế hoạch nhân sự và thời gian, A250.2 phân công nhiệm vụ.",need:["A220","Danh sách phần hành trọng yếu"]});
p("A260","Cam kết về tính độc lập","plan","V",{d:"Từng thành viên nhóm cam kết độc lập.",need:["Danh sách thành viên nhóm"]});
p("A270","Soát xét yếu tố ảnh hưởng tính độc lập và biện pháp bảo vệ","plan","V",{d:"Nhận diện nguy cơ (tư lợi, tự kiểm tra, thân thuộc…) và biện pháp.",need:["A260","Quan hệ của thành viên với khách hàng"]});
p("A280","Trao đổi với nhóm kiểm toán về kế hoạch","plan","V",{d:"Họp nhóm: rủi ro gian lận, vùng dễ sai, phân công.",need:["A310","A510","A810"]});
p("A290","Trao đổi với BGĐ để lập kế hoạch","plan","V",{d:"Ghi lại nội dung trao đổi với BGĐ và BQT (A290–A292).",need:["Danh sách nhân sự chủ chốt","Lịch kiểm toán"]});
p("A310","Tìm hiểu khách hàng và môi trường hoạt động","plan","V",{d:"Hiểu ngành nghề, sản phẩm, nguồn cung, khách hàng, mục tiêu và rủi ro kinh doanh.",need:["Giấy phép, điều lệ, sơ đồ tổ chức","Phỏng vấn BGĐ","Thông tin ngành","BCTC và báo cáo quản trị"]});
p("A311","Danh sách pháp luật và quy định ảnh hưởng","plan","V",{d:"Luật, quy định có ảnh hưởng trực tiếp và gián tiếp tới BCTC.",need:["Ngành nghề, giấy phép con","Chế độ kế toán áp dụng"]});
p("A312","Các bên liên quan","plan","V",{d:"Danh sách bên liên quan và loại giao dịch.",need:["Sổ cổ đông, danh sách công ty cùng nhóm","Phỏng vấn BGĐ"]});
p("A313","Hệ thống kế toán ghi chép, xử lý giao dịch","plan","V",{d:"Phần mềm, luồng dữ liệu, phân quyền, bút toán thủ công.",need:["Phỏng vấn kế toán trưởng","Mô tả phần mềm, phân quyền"]});
p("A314","Các ước tính kế toán","plan","V",{d:"Liệt kê ước tính (dự phòng, khấu hao, giá trị thuần…) và mức độ không chắc chắn.",need:["Chính sách kế toán","Cách BGĐ lập từng ước tính"]});
p("A410","Tìm hiểu chu trình bán hàng, phải thu, thu tiền","plan","V",{d:"Mô tả chu trình, nhận diện kiểm soát chính theo từng cơ sở dẫn liệu.",need:["Quy trình bán hàng","Phỏng vấn kinh doanh, kế toán","Bộ chứng từ mẫu"]});
p("A411","Walk-through chu trình bán hàng","plan","V",{d:"Đi theo một giao dịch từ đầu đến cuối để xác nhận chu trình đúng như mô tả.",need:["Một bộ chứng từ bán hàng đầy đủ"]});
p("A420","Tìm hiểu chu trình mua hàng, phải trả, trả tiền","plan","V",{d:"Mô tả chu trình, nhận diện kiểm soát chính.",need:["Quy trình mua hàng","Phỏng vấn mua hàng, kho, kế toán","Bộ chứng từ mẫu"]});
p("A421","Walk-through chu trình mua hàng","plan","V",{d:"Đi theo một giao dịch mua hàng từ đề nghị mua tới trả tiền.",need:["Một bộ chứng từ mua hàng đầy đủ"]});
p("A430","Tìm hiểu chu trình hàng tồn kho, giá thành, giá vốn","plan","V",{d:"Mô tả nhập, xuất, tính giá, tập hợp giá thành.",need:["Quy trình kho và giá thành","Phương pháp tính giá"]});
p("A431","Walk-through chu trình hàng tồn kho","plan","V",{d:"Đi theo một giao dịch nhập, xuất, tính giá.",need:["Bộ chứng từ kho và bảng tính giá thành"]});
p("A440","Tìm hiểu chu trình lương và phải trả người lao động","plan","V",{d:"Mô tả tuyển dụng, chấm công, tính lương, chi lương.",need:["Quy chế lương","Phỏng vấn nhân sự, kế toán"]});
p("A441","Walk-through chu trình lương","plan","V",{d:"Đi theo một kỳ lương của một nhân viên.",need:["HĐLĐ, bảng chấm công, bảng lương, chứng từ chi"]});
p("A450","Tìm hiểu chu trình TSCĐ và XDCB","plan","V",{d:"Mô tả đề xuất, mua sắm, nghiệm thu, ghi tăng, khấu hao, thanh lý.",need:["Quy trình đầu tư, mua sắm","Phỏng vấn","Bộ hồ sơ một tài sản"]});
p("A451","Walk-through chu trình TSCĐ và XDCB","plan","V",{d:"Đi theo một tài sản từ đề xuất tới ghi tăng và trích khấu hao.",need:["Hồ sơ đầy đủ một TSCĐ tăng trong kỳ"]});
p("A460","Tìm hiểu chu trình khoá sổ, lập và trình bày BCTC","plan","V",{d:"Ai lập, ai soát xét, bút toán cuối kỳ, kết chuyển.",need:["Quy trình khoá sổ","Danh sách bút toán điều chỉnh cuối kỳ"]});
p("A510","Phân tích sơ bộ BCTC","plan","V",{d:"So sánh biến động, tỷ trọng, tỷ suất để khoanh vùng rủi ro. Không phải thử nghiệm cơ bản.",need:["BCTC trước kiểm toán và năm trước","CĐPS","Hiểu biết từ A310"]});
p("A520","Soát xét sự kiện gây nghi ngờ hoạt động liên tục","plan","V",{d:"Dấu hiệu tài chính, hoạt động có thể ảnh hưởng giả định hoạt động liên tục.",need:["BCTC","Kế hoạch dòng tiền","Hợp đồng vay"]});
p("A610","Đánh giá KSNB ở cấp độ toàn doanh nghiệp","plan","V",{d:"Năm thành phần KSNB: môi trường kiểm soát, đánh giá rủi ro, thông tin, hoạt động kiểm soát, giám sát.",need:["Quy chế nội bộ","Phỏng vấn BGĐ","Quan sát thực tế"]});

note("gv","D700",["C150","D736"],"Kiểm tra mẫu chọn kiểm soát có thể kết hợp với D736 (thử nghiệm song song), tránh làm trùng.");
note("gv","D700",["C250","E130"],"Soát xét nghị quyết: vốn điều lệ tăng nhưng chưa góp đủ thì có rủi ro về chi phí lãi vay.");
note("gv","D700",["D710"],"Leadsheet phải đối chiếu với bảng tổng hợp TSCĐ và logic với công việc đã làm. Giấy đối chiếu leadsheet với BCĐKT gộp vào D710, kèm bút toán điều chỉnh giá trị còn lại của tài sản thanh lý.");
note("gv","D700",["D734"],"Phân tích cơ bản phải đặt câu hỏi về nguồn: vốn chủ tăng 8 tỷ mà TSCĐ và XDCB tăng 20 tỷ thì phần còn lại là vay dài hạn. Vốn mỏng, vay nhiều thì có động cơ xử lý BCTC.");
note("gv","D700",["D730.1","A820"],"Biện pháp trong chương trình kiểm toán phải logic với A820, đừng nhận diện rủi ro quá phức tạp. Trình bày ngay khi vào mã D, sau đó mới tới D710.");
note("gv","D700",["D735"],"Kế hoạch mẫu kiểm kê và thực tế phải khớp (dự kiến chọn mẫu mà thực tế kiểm hết). Giữ hoài nghi nghề nghiệp: công ty vận tải mà toàn bộ xe có mặt tại công ty vào ngày kiểm kê là điều bất hợp lý.");
note("gv","D700",["D736"],"Nêu lý do chọn cỡ mẫu. Tách ký hiệu theo từng loại chứng từ cơ bản. Cập nhật quy định thanh toán không dùng tiền mặt từ 5 triệu đồng.");
note("gv","D700",["D738"],"Đây là vùng rủi ro cao: doanh nghiệp đi vay thì có rủi ro treo chi phí vào tài sản (lãi giả, lỗ thật).");
note("gv","D700",["D739"],"Làm rõ ba cột: đơn vị, KTV tính lại, chênh lệch. Khấu hao nhanh vẫn được chấp nhận nếu thoả điều kiện. So chênh lệch với ngưỡng sai sót có thể bỏ qua. Giấy này được khen vì đi tới tận cùng bằng chứng.");
// Doanh thu (từ bài thực hành)
note("th","G100",["G172","G173","D534"],"Hàng xuất cho đại lý ký gửi vẫn là hàng gửi bán (TK 157) cho tới khi có bảng kê tiêu thụ. Kiểm tra hợp đồng đại lý và xác nhận lượng hàng còn tồn tại đại lý.");
note("th","G100",["G170","G171"],"Chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại dễ bị hạch toán lẫn nhau. Chiết khấu đã trừ trên hoá đơn thì không ghi qua 521.");
note("th","G100",["G173","G160"],"Kênh thương mại điện tử và COD: sàn, đơn vị vận chuyển cấn trừ phí rồi mới trả tiền, đơn vị dễ ghi doanh thu theo số thuần và sai kỳ. Đối chiếu báo cáo đối soát, xác nhận tiền COD còn ở đơn vị vận chuyển.");
note("th","G100",["G146","G173"],"Hợp đồng nghiệm thu theo đợt: không ghi doanh thu đợt sau khi chưa có biên bản nghiệm thu, bàn giao.");
note("th","G100",["G171"],"Hợp đồng bán hàng kèm dịch vụ phải tách doanh thu dịch vụ (5113) khỏi hàng hoá (5111).");
note("th","G100",["A520","G310"],"Phí sàn tăng mà chi phí bán hàng trên BCTC giảm là dấu hiệu chi phí ghi thiếu, chuyển sang kiểm tra chi phí bán hàng.");
note("th","G100",["A710"],"Tiêu chí lợi nhuận trước thuế chỉ dùng được khi lợi nhuận ổn định qua các năm, cần ghi rõ lý do chọn tiêu chí và tỷ lệ.");

/* ---------- 4. GIAO DIỆN ---------- */
const $=s=>document.querySelector(s), main=$("#main"), idx=$("#idx");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const col=id=>`var(${PH[id[0]].c})`;
const h2id=h=>{h=decodeURIComponent(h.replace(/^#/,""));if(P[h]||S[h])return h;const d=h.replace(/-/g,".");return (P[d]||S[d])?d:null;};
const name=id=>S[id]?S[id].n:P[id]?P[id].n:id;
let cur="D100", filt="", myNotes={};
try{myNotes=JSON.parse(localStorage.getItem("wpmap-notes")||"{}");}catch(_){}
const notesFor=id=>{const pp=P[id];return N.filter(n=>n.p.includes(id)||(pp&&n.kind&&n.kind===pp.kind&&pp.src==="X"));};
const secNotes=c=>N.filter(n=>n.a===c);
const KIND={plan:"Lập kế hoạch",ctrl:"Kiểm soát, thủ tục chung",lead:"Leadsheet",tm:"Thuyết minh",prog:"Chương trình kiểm toán",test:"Thử nghiệm cơ bản",form:"Mẫu thư, phiếu",sum:"Tổng hợp phần hành",concl:"Tổng hợp, báo cáo",other:"Nội dung khác"};
function generic(pp){const s=S[pp.sec];const o={d:pp.d,need:pp.need};
  if(pp.kind==="lead"){o.d=o.d||`Trình bày số trước kiểm toán, điều chỉnh, số sau kiểm toán của ${s.n} (TK ${s.tk}); đối chiếu với sổ cái, CĐPS và số năm trước.`;o.need=o.need||["CĐPS, sổ cái, sổ chi tiết","BCTC năm trước","Bút toán điều chỉnh từ các giấy chi tiết"];}
  if(pp.kind==="tm"){o.d=o.d||`Số liệu chi tiết phục vụ thuyết minh ${s.n}. Làm sau khi đã chốt bút toán điều chỉnh.`;o.need=o.need||["Leadsheet sau điều chỉnh","Yêu cầu thuyết minh của chế độ kế toán","Chi tiết theo đối tượng, kỳ hạn, nguyên tệ"];}
  if(pp.kind==="prog"){o.d=o.d||`Mục tiêu kiểm toán, rủi ro theo cơ sở dẫn liệu và danh sách thủ tục cho ${s.n}, kèm tham chiếu tới giấy thực hiện.`;o.need=o.need||["Mức trọng yếu thực hiện và ngưỡng sai sót (A710)","Rủi ro và biện pháp (A810, A820)","Kết quả thử nghiệm kiểm soát"+(s.ctl.length?` (${s.ctl.join(", ")})`:"")];}
  if(pp.kind==="form"){o.d=o.d||"Mẫu thư hoặc phiếu dùng để thu thập bằng chứng từ bên ngoài hoặc từ quan sát trực tiếp.";o.need=o.need||["Danh sách đối tượng được chọn","Số dư tại ngày khoá sổ","Chữ ký người có thẩm quyền của khách hàng"];}
  if(pp.kind==="test"){o.d=o.d||"Giấy thực hiện thủ tục trong chương trình kiểm toán.";o.need=o.need||["Sổ chi tiết liên quan","Chứng từ gốc"];}
  return o;}
function chip(id,withName){if(!P[id]&&!S[id])return `<span class="chip"><span class="code">${esc(id)}</span></span>`;
  return `<button class="chip" style="--c:${col(id)}" data-go="${esc(id)}" title="${esc(name(id))}"><span class="code">${esc(id)}</span>${withName?`<small>${esc(name(id))}</small>`:""}</button>`;}
function asTags(a){return (a||"").split(" ").filter(Boolean).map(x=>`<span class="as" title="${esc(AS[x]||x)}">${x}</span>`).join("");}
function groupEdges(list,key){const m=new Map();list.forEach(x=>{if(!m.has(x.w))m.set(x.w,[]);if(!m.get(x.w).includes(x[key]))m.get(x.w).push(x[key]);});
  if(!m.size)return `<p class="empty">Không có</p>`;
  return [...m].map(([w,ids])=>`<div class="eg"><p>${esc(w)}</p><div class="chips">${ids.map(i=>chip(i,ids.length<=5)).join("")}</div></div>`).join("");}
function noteHtml(n,showAt){return `<div class="note ${n.k}"><b>${n.k==="gv"?"Giảng viên nhận xét":"Rút ra từ bài thực hành"}${n.a!=="Chung"&&S[n.a]?" · "+esc(S[n.a].n.split(",")[0].split(" ngắn")[0]):n.a==="Chung"?" · áp dụng chung":""}</b>${esc(n.t)}${showAt&&n.p.length?`<div class="chips at">${n.p.map(i=>chip(i)).join("")}</div>`:""}</div>`;}
function myNoteCard(id){return `<section class="card wide"><h3>Ghi chú của tôi cho ${esc(id)}</h3><textarea id="mynote" placeholder="Ghi lại nhận xét của giảng viên, lỗi đã gặp, thủ tục đã dùng…">${esc(myNotes[id]||"")}</textarea><p style="margin:8px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" id="copyNotes">Sao chép toàn bộ ghi chú</button><span class="empty" id="copyMsg">Ghi chú chỉ lưu trên trình duyệt này. Sao chép và gửi lại để đưa vào bản đồ.</span></p></section>`;}

function renderPaper(id){const pp=P[id],g=generic(pp),s=S[pp.sec];
  const inn=E.filter(x=>x.t===id),out=E.filter(x=>x.f===id),ns=notesFor(id);
  const accs=s?[s.code]:[...new Set(Object.values(S).filter(x=>x.cyc.includes(id)||x.ctl.includes(id)).map(x=>x.code))];
  const procs=s?s.proc.filter(r=>r[1].includes(id)):[];
  const srcPill=pp.src==="V"?`<span class="pill v">Có mẫu VACPA</span>`:pp.src==="I"?`<span class="pill">Trong danh mục VACPA</span>`:`<span class="pill x">Bổ sung từ bài thực hành</span>`;
  main.innerHTML=`<div style="--c:${col(id)}">
  <div class="head"><span class="big">${esc(id)}</span><div><h2>${esc(pp.n)}</h2><div class="chips"><span class="pill">${esc(PH[pp.g].n)}</span><span class="pill">${KIND[pp.kind]}</span>${srcPill}${s?`<button class="chip" data-go="${s.code}" style="--c:${col(id)}"><span class="code">${s.code}</span><small>${esc(s.n)}</small></button>`:""}</div></div></div>
  <p class="lede">${esc(g.d||"")}</p>
  <div class="flow">
    <div class="col"><h3>Nhận từ (${new Set(inn.map(x=>x.f)).size})</h3>${groupEdges(inn,"f")}</div><div class="arr" aria-hidden="true">→</div>
    <div class="col me"><span class="code">${esc(id)}</span><span>${esc(pp.n)}</span></div><div class="arr" aria-hidden="true">→</div>
    <div class="col"><h3>Đẩy sang (${new Set(out.map(x=>x.t)).size})</h3>${groupEdges(out,"t")}</div>
  </div>
  <div class="cards">
    <section class="card"><h3>Cần thông tin gì</h3><ul>${(g.need||[]).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>Theo mẫu VACPA</li>"}</ul></section>
    <section class="card"><h3>Khoản mục và cơ sở dẫn liệu</h3>
      ${pp.as?`<p>${asTags(pp.as)}</p><p class="empty">${pp.as.split(" ").map(x=>x+" = "+AS[x]).join(" · ")}</p>`:""}
      ${accs.length?`<div class="chips">${accs.map(c=>chip(c,true)).join("")}</div>`:`<p class="empty">Áp dụng cho toàn bộ cuộc kiểm toán, không gắn riêng khoản mục nào.</p>`}
      ${s&&s.mat?`<p style="margin-top:8px"><b>Khi nào trọng yếu:</b> ${esc(s.mat)}</p>`:""}</section>
    ${procs.length?`<section class="card"><h3>Thủ tục dùng ở giấy này</h3><ul>${procs.map(r=>`<li>${esc(r[0])} ${asTags(r[2])}</li>`).join("")}</ul></section>`:""}
    ${pp.kind==="prog"&&s?`<section class="card wide"><h3>Thủ tục trong chương trình và giấy thực hiện</h3>${procTable(s)}</section>`:""}
    <section class="card wide"><h3>Dễ sai ở giấy này (${ns.length})</h3>${ns.length?ns.map(n=>noteHtml(n)).join(""):`<p class="empty">Chưa có lưu ý nào cho giấy này. Thêm ở ô ghi chú bên dưới.</p>`}</section>
    ${myNoteCard(id)}
  </div></div>`;}
function procTable(s){return `<div class="tw"><table><tr><th>Thủ tục</th><th>Cơ sở dẫn liệu</th><th>Giấy</th></tr>${s.proc.map(r=>`<tr><td>${esc(r[0])}</td><td>${asTags(r[2])}</td><td><div class="chips">${r[1].map(i=>chip(i)).join("")||'<span class="empty">vùng x50–x99</span>'}</div></td></tr>`).join("")}</table></div>`;}
function renderSec(c){const s=S[c],mine=Object.values(P).filter(x=>x.sec===c);
  const by=k=>mine.filter(x=>[].concat(k).includes(x.kind)).map(x=>x.id);
  const steps=[["Hiểu chu trình",s.cyc.flatMap(a=>[a,a.slice(0,3)+"1"]).filter(a=>P[a])],["Trọng yếu, rủi ro",["A710","A810","A820"]],["Kiểm soát",s.ctl.concat(["C220"])],["Chương trình",by("prog")],["Thử nghiệm cơ bản",by(["test","form"])],["Tổng hợp",by(["sum","lead","tm"])],["Báo cáo",["B360",s.g==="G"?"B342":"B341","B410","B210"]]].filter(x=>x[1].length);
  const ns=secNotes(c);
  main.innerHTML=`<div style="--c:${col(c)}">
  <div class="head"><span class="big">${c}</span><div><h2>${esc(s.n)}</h2><div class="chips"><span class="pill">Chỉ mục phần hành</span><span class="pill">TK ${esc(s.tk)}</span><span class="pill">${mine.length} giấy</span></div></div></div>
  <p class="lede"><b>Khi nào trọng yếu:</b> ${esc(s.mat||"")}</p>
  <div class="cards">
    <section class="card wide"><h3>Đường đi của hồ sơ</h3><div class="path">${steps.map(([t,ids])=>`<div class="st"><span>${t}</span><div class="chips">${ids.map(i=>chip(i)).join("")}</div></div>`).join("<i>→</i>")}</div></section>
    ${s.csdl.length?`<section class="card"><h3>Rủi ro theo cơ sở dẫn liệu</h3><div class="tw"><table>${s.csdl.map(r=>`<tr><td>${asTags(r[0])}</td><td>${esc(AS[r[0]])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div></section>`:""}
    <section class="card"><h3>Khoản mục liên quan</h3>${s.rel.map(r=>`<div class="eg"><div class="chips">${chip(r[0],true)}</div><p>${esc(r[1])}</p></div>`).join("")}</section>
    <section class="card wide"><h3>Thủ tục chính và giấy thực hiện</h3>${procTable(s)}</section>
    <section class="card"><h3>Tài liệu cần khách hàng cung cấp</h3><ul>${s.docs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p style="margin-top:8px" class="chips">${chip("A240",true)}</p></section>
    <section class="card wide"><h3>Dễ sai ở khoản mục này (${ns.length})</h3>${ns.length?ns.map(n=>noteHtml(n,true)).join(""):`<p class="empty">Chưa có nhận xét của giảng viên cho khoản mục này. Hiện có ghi chú cho Tiền, TSCĐ, Phải trả người bán, Doanh thu.</p>`}</section>
    ${myNoteCard(c)}
  </div></div>`;}

function renderIdx(){const f=fold(filt.trim());const hit=(id,n)=>!f||fold(id+" "+n).includes(f);
  let h=`<div class="legend"><span><i style="background:var(--pA)"></i>Kế hoạch</span><span><i style="background:var(--pC)"></i>Kiểm soát</span><span><i style="background:var(--pS)"></i>Thử nghiệm cơ bản</span><span><i style="background:var(--pB)"></i>Báo cáo</span><span><em></em>Có lưu ý</span></div>`;
  ORDER.forEach(g=>{let inner="";
    const row=x=>`<button class="row${x.src==="X"?" x":""}${x.id===cur?" on":""}${N.some(n=>n.p.includes(x.id))?" hasnote":""}" data-go="${x.id}" style="--c:${col(x.id)}"><span class="code">${x.id}</span><span class="nm">${esc(x.n)}</span></button>`;
    const secs=Object.values(S).filter(s=>s.g===g);
    if(secs.length){secs.forEach(s=>{const rows=Object.values(P).filter(x=>x.sec===s.code&&hit(x.id,x.n));if(!rows.length&&!hit(s.code,s.n))return;
      inner+=`<div class="sec"><button data-go="${s.code}" class="${s.code===cur?"on":""}${secNotes(s.code).length?" hasnote":""}" style="--c:${col(s.code)}"><span class="code">${s.code}</span><span>${esc(s.n)}</span></button>${(f||s.code===cur||P[cur]&&P[cur].sec===s.code)?rows.map(row).join(""):""}</div>`;});}
    else inner=Object.values(P).filter(x=>x.g===g&&!x.sec&&hit(x.id,x.n)).map(row).join("");
    if(inner)h+=`<div class="grp" style="--c:var(${PH[g].c})"><button class="gh" tabindex="-1"><i></i>${PH[g].n}</button>${inner}</div>`;});
  idx.innerHTML=h;}
function go(id,push){if(!P[id]&&!S[id])return;cur=id;S[id]?renderSec(id):renderPaper(id);renderIdx();
  $("#acc").value=S[id]?id:(P[id].sec||"");main.scrollTop=0;
  const on=idx.querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest"});
  if(push!==false){try{location.hash=id.replace(/\./g,"-");}catch(_){}}}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-go]");if(b){go(b.dataset.go);return;}
  if(ev.target.id==="copyNotes"){const txt=Object.entries(myNotes).filter(([,v])=>v.trim()).map(([k,v])=>k+" · "+name(k)+"\n"+v.trim()).join("\n\n")||"(chưa có ghi chú)";
    const msg=$("#copyMsg");const done=ok=>{if(msg)msg.textContent=ok?"Đã sao chép.":"Trình duyệt không cho sao chép. Hãy bôi đen và chép tay từng ô.";};
    try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false));}catch(_){done(false);}}});
document.addEventListener("input",ev=>{if(ev.target.id==="mynote"){myNotes[cur]=ev.target.value;try{localStorage.setItem("wpmap-notes",JSON.stringify(myNotes));}catch(_){}}
  if(ev.target.id==="q"){filt=ev.target.value;renderIdx();}});
$("#q").addEventListener("keydown",ev=>{if(ev.key==="Enter"){const first=idx.querySelector(".row,.sec>button");if(first)go(first.dataset.go);}});
$("#acc").innerHTML=`<option value="">Tất cả</option>`+Object.values(S).map(s=>`<option value="${s.code}">${s.code} · ${esc(s.n)}</option>`).join("");
$("#acc").addEventListener("change",ev=>{if(ev.target.value)go(ev.target.value);});
window.addEventListener("hashchange",()=>{const id=h2id(location.hash);if(id&&id!==cur)go(id,false);});
go(h2id(location.hash)||"D100",false);
</script>
</body>
</html>
